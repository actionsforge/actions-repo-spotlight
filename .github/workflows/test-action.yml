name: Test Action

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-action:
    name: Test Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action
        uses: ./
        with:
          token: ${{ secrets.GH_SPOTLIGHT_TOKEN }}
          limit: '3'
          delay: '300'
          min_views: '0'
          include_forks: 'false'
          include_archived: 'false'
